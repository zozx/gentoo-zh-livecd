name: Build Gentoo CJK Minimal ISO

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: gentoo-cjk-iso
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio \
            curl \
            git \
            gzip \
            initramfs-tools-core \
            squashfs-tools \
            xorriso \
            xz-utils \
            zstd

      - name: Build ISO
        run: |
          mkdir -p dist
          sudo bash scripts/build.sh "$PWD/dist"
          sudo chown -R "$USER:$USER" dist

      - uses: actions/upload-artifact@v4
        with:
          name: gentoo-cjk-minimal
          path: dist/*
          compression-level: 0
          retention-days: 14

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
